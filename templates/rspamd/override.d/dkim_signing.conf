# Signature DKIM multi-domaines : un domaine = une clé générée par `./mailctl dkim <domaine>`.
# Nom de fichier produit par l'outil `setup config dkim` de DMS (RSA 2048, sélecteur "mail").
enabled = true;
sign_authenticated = true;
sign_local = true;
use_domain = "header";
use_esld = true;
allow_username_mismatch = true;
selector = "mail";
path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-$selector-$domain.private.txt";
